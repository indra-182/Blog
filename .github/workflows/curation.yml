name: Daily Curation Pipeline

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC daily
  workflow_dispatch:       # manual trigger

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # required to push back
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate curation draft
        run: node .github/scripts/fetch-curation.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push if draft created
        run: |
          if [[ -n "$(git status --porcelain content/drafts/)" ]]; then
            git config user.name "curation-bot"
            git config user.email "curation-bot@users.noreply.github.com"
            git add content/drafts/
            git commit -m "chore: daily curation draft $(date +%Y-%m-%d)"
            git push
          else
            echo "No new draft generated."
          fi
